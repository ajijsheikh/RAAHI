name: raahi
description: Raahi - Agentic Safety-Aware Travel Companion
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ">=3.0.0 <4.0.0"

uses-material3: true

dependencies:
  flutter:
    sdk: flutter

  # State management & DI
  riverpod: ^2.5.0

  # Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  hive_flutter: ^1.1.0

  # HTTP client
  dio: ^5.7.0

  # Maps
  mapbox_maps_flutter: ^2.6.0

  # Location
  geolocator: ^10.0.0
  permission_handler: ^10.0.0

  # Secure storage
  flutter_secure_storage: ^9.2.2

  # URL launcher for amenity links
  url_launcher: ^6.3.1

  # Internationalization
  intl: ^0.19.0

  # Connectivity awareness
  connectivity_plus: ^5.0.0

  # Optional: voice input
  speech_to_text: ^6.2.0

flutter:

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.0
  freezed: ^2.4.0
  json_serializable: ^6.8.0