name: raahi
description: Raahi - Agentic Safety-Aware Travel Companion
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ">=3.0.0 <4.0.0"

uses-material3: true

dependencies:
  flutter:
    sdk: flutter

  # State management & DI
  flutter_riverpod: ^2.6.1

  # HTTP client
  dio: ^5.7.0

  # Navigation
  go_router: ^14.6.2

  # Secure storage (user_id, emergency contact)
  flutter_secure_storage: ^9.2.2

  # URL launcher (call contact / open map links)
  url_launcher: ^6.3.1

  # Date/time formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
